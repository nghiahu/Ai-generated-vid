<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Setup OmniVoice</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #0f172a;
      user-select: none;
      -webkit-app-region: drag;
    }
    .container {
      text-align: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 40px;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    h2 {
      font-size: 20px;
      margin: 0 0 10px 0;
      font-weight: 700;
      color: #1e293b;
    }
    p {
      font-size: 13px;
      color: #64748b;
      margin: 0 0 24px 0;
      line-height: 1.6;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background-color: #f1f5f9;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      border-radius: 3px;
      animation: loading 1.8s infinite ease-in-out;
    }
    @keyframes loading {
      0% {
        left: -30%;
      }
      50% {
        left: 50%;
        width: 40%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔊</div>
    <h2>Đang cài đặt giọng đọc Offline</h2>
    <p>Đang giải nén bộ thư viện OmniVoice. Quá trình này diễn ra một lần duy nhất khi khởi chạy lần đầu. Xin vui lòng không tắt ứng dụng...</p>
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>
  </div>
</body>
</html>
