<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Studio AI Gen Validation Sandbox</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <style>
    #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Mock Remotion and Lucide variables on window
    window.React = React;
    window.Remotion = {
      useCurrentFrame: () => 0,
      useVideoConfig: () => ({ width: 1080, height: 1920, fps: 30, durationInFrames: 120 }),
      spring: () => 1,
      interpolate: () => 0
    };
    window.LucideIcons = new Proxy({}, { get: () => () => React.createElement('div') });

    // React Error Boundary Helper
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      componentDidCatch(error, errorInfo) {
        window.parent.postMessage({ type: 'VALIDATION_ERROR', error: error.message, stack: errorInfo.componentStack }, '*');
      }
      render() { return this.state.hasError ? null : this.props.children; }
    }

    window.addEventListener('message', async (e) => {
      if (e.data.type === 'VALIDATE_CODE') {
        const { code, sceneData } = e.data;
        const rootEl = document.getElementById('root');
        
        try {
          // Process and load compiled code dynamically via blob URL
          let rewrittenJS = code
            .replace(/import\s+([\s\S]*?)\s+from\s+['"]react['"];?/gi, "const React = window.React;")
            .replace(/import\s+([\s\S]*?)\s+from\s+['"]remotion['"];?/gi, "const { useCurrentFrame, spring, interpolate } = window.Remotion;")
            .replace(/import\s+([\s\S]*?)\s+from\s+['"]lucide-react['"];?/gi, "const LucideIcons = window.LucideIcons;");

          const blob = new Blob([rewrittenJS], { type: 'application/javascript' });
          const url = URL.createObjectURL(blob);
          const mod = await import(url);
          const Component = mod.default || mod.GeneratedScene;

          const root = ReactDOM.createRoot(rootEl);
          root.render(React.createElement(ErrorBoundary, null, React.createElement(Component, { scene: sceneData || {} })));

          // Wait brief frame for layout to render fully
          requestAnimationFrame(() => {
            const errors = [];
            const elements = Array.from(rootEl.querySelectorAll('h1, h2, p, img, span, div, [class*="card"], [class*="tile"]'))
              .filter(el => {
                const rect = el.getBoundingClientRect();
                return rect.width > 0 && rect.height > 0 && (el.innerText?.trim() || el.tagName === 'IMG');
              });

            // 1. Check safe zone overflow (bottom 22% is y > 1498px)
            elements.forEach(el => {
              const rect = el.getBoundingClientRect();
              if (rect.bottom > 1498 && el.innerText?.trim()) {
                errors.push({ type: 'safe-zone-overflow', message: `Element containing "${el.innerText.trim().substring(0, 15)}..." overflowed into subtitle safe zone` });
              }
            });

            // 2. Check Overlaps (Pairwise Collisions)
            for (let i = 0; i < elements.length; i++) {
              for (let j = i + 1; j < elements.length; j++) {
                const el1 = elements[i];
                const el2 = elements[j];

                // Skip parent-child overlap checks
                if (el1.contains(el2) || el2.contains(el1)) continue;

                const r1 = el1.getBoundingClientRect();
                const r2 = el2.getBoundingClientRect();

                const xOverlap = Math.max(0, Math.min(r1.right, r2.right) - Math.max(r1.left, r2.left));
                const yOverlap = Math.max(0, Math.min(r1.bottom, r2.bottom) - Math.max(r1.top, r2.top));
                const intersection = xOverlap * yOverlap;

                if (intersection > 0) {
                  const area1 = r1.width * r1.height;
                  const area2 = r2.width * r2.height;
                  const minArea = Math.min(area1, area2);
                  const ratio = intersection / minArea;
                  
                  if (ratio > 0.20) {
                    errors.push({
                      type: 'visual-overlap',
                      message: `Overlap collision: "${el1.innerText?.trim().substring(0, 10) || el1.tagName}" overlaps with "${el2.innerText?.trim().substring(0, 10) || el2.tagName}" by ${(ratio * 100).toFixed(0)}%`
                    });
                  }
                }
              }
            }

            // 3. Check Text Truncation / Overflow Clipping
            elements.forEach(el => {
              if (el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) {
                errors.push({ type: 'text-clipping', message: `Text truncated/overflowed: "${el.innerText?.trim().substring(0, 15)}..."` });
              }
            });

            // Post validation result
            if (errors.length > 0) {
              window.parent.postMessage({
                type: 'VALIDATION_ERROR',
                error: errors[0].message,
                errors
              }, '*');
            } else {
              window.parent.postMessage({
                type: 'VALIDATION_SUCCESS',
                errors: []
              }, '*');
            }
          });
        } catch (err) {
          window.parent.postMessage({ type: 'VALIDATION_ERROR', error: err.message, stack: err.stack }, '*');
        }
      }
    });
  </script>
</body>
</html>
